crawler:
  start_urls:
    - "https://www.lefaso.net"
    - "https://journaldumali.com"
    - "https://www.actuniger.com"
    - "https://www.lobservateur.bf"


  headers:
    User-Agent: "SpiderBot/1.0 (+https://github.com/ScrApErxeb/Spider)"
    Accept-Language: "en,fr,es,zh,de,ar,pt,hi,ru,ja"
  
  
  timeout: 10
  retries: 3
  max_pages: 200
  robots: false
  rate_limit_per_domain: 2

http_cache:
  enabled: true
  ttl: 300

allowed_langs: ["en", "fr"]

rate_limit_enabled: true

storage:
  database_path: "data/project.db"
  export_dir: "exports"

logging:
  level: "INFO"
  file: "logs/pipeline.log"
