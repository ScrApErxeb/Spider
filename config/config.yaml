crawler:
  start_urls:
    - "http://www.google.com"
    - "https://www.python.org"
    - "https://www.github.com"
    - "https://www.stackoverflow.com"
    - "https://www.reddit.com"

  headers:
    User-Agent: "SpiderBot/1.0 (+https://github.com/ScrApErxeb/Spider)"
    Accept-Language: "en,fr,es,zh,de,ar,pt,hi,ru,ja"

  retries: 3
  max_pages: 20

  rate_limit_per_domain: 2
  
  timeout: 10
  robots:
    enabled: false        # active la vérification robots.txt
    cache_expiry: 3600   # durée (en secondes) de validité du cache robots.txt

  languages:
    - en
    - zh
    - hi
    - es
    - fr
    - ar
    - bn
    - ru
    - pt
    - ur



storage:
  database_path: "data/project.db"
  export_dir: "exports"

logging:
  level: "INFO"
  file: "logs/pipeline.log"


version: 1
formatters:
  simple:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
loggers:
  crawler:
    level: INFO
    handlers: [console]
  scraper:
    level: INFO
    handlers: [console]
  storage:
    level: INFO
    handlers: [console]
root:
  level: WARNING
  handlers: [console]
