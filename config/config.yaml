crawler:
  start_urls:
    - "https://www.lefaso.net"

  headers:
    User-Agent: "SpiderBot/1.0 (+https://github.com/ScrApErxeb/Spider)"
    Accept-Language: "en,fr,es,zh,de,ar,pt,hi,ru,ja"

  timeout: 10
  retries: 3
  max_pages: 200
  robots: false

  rate_limit:
    enabled: true
    delay: 2

  
  languages:
    - en
    - zh
    - hi
    - es
    - fr
    - ar
    - bn
    - ru
    - pt
    - ur


http_cache:
  enabled: true
  ttl: 300


storage:
  database_path: "data/project.db"
  export_dir: "exports"


logging:
  level: "INFO"
  file: "logs/pipeline.log"


version: 1
formatters:
  simple:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple

loggers:
  crawler:
    level: INFO
    handlers: [console]
  scraper:
    level: INFO
    handlers: [console]
  storage:
    level: INFO
    handlers: [console]

root:
  level: WARNING
  handlers: [console]
